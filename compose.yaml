name: picture-postcard-manager

services:
  app:
    build:
      context: .
      args:
        # The in-container app user; override for Linux bind mounts owned by
        # another host account (see README "Running as a non-root user").
        PPM_UID: ${PPM_UID:-1000}
        PPM_GID: ${PPM_GID:-1000}
        # Version shown in the UI footer; local builds default to "dev".
        # Override with PPM_VERSION=X.Y.Z in the environment or .env file.
        PPM_VERSION: ${PPM_VERSION:-dev}
    ports:
      - "127.0.0.1:${PPM_PORT:-8000}:8000"
    volumes:
      - postcard-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postcard-data:
