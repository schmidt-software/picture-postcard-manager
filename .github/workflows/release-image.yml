# Publish a multi-architecture Docker image to GitHub Container Registry
# (GHCR) for every published GitHub Release (Refs #42).
#
# Tag convention (documented in README.md, "Container images"):
#   - Stable release vX.Y.Z      -> X.Y.Z, vX.Y.Z and latest
#   - Prerelease   vX.Y.Z-<pre>  -> X.Y.Z-<pre> and vX.Y.Z-<pre> (never latest)
#
# Security:
#   - Triggered only by `release: published` (drafts never fire `published`;
#     an explicit guard below documents and enforces this anyway).
#   - Least-privilege GITHUB_TOKEN (contents: read, packages: write); no
#     long-lived credentials.
#   - All third-party actions are pinned to immutable commit SHAs.
#   - The release tag name is only used via `env:` in shell steps (never
#     interpolated directly into `run:` scripts) and is validated as strict
#     semver before anything is built or pushed.

name: Release image

on:
  release:
    types: [published]

# One publish run per release tag; a re-published release waits for a
# still-running publish of the same tag instead of racing it.
concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Belt and braces: `published` already excludes drafts, but never build
    # from a draft even if trigger semantics change.
    if: ${{ !github.event.release.draft }}
    steps:
      - name: Validate release tag is strict semver
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Accept vMAJOR.MINOR.PATCH with an optional semver prerelease
          # suffix (e.g. v0.1.0, v1.2.3-rc.1). Anything else aborts before
          # any build or push happens.
          if ! printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::Release tag '$TAG' is not a semver tag (vMAJOR.MINOR.PATCH[-prerelease]); refusing to publish." >&2
            exit 1
          fi

      # Check out the release's tag commit explicitly. The release event runs
      # with default-branch workflow context, so an implicit checkout could
      # otherwise build the wrong commit. fetch-depth: 0 brings in main for
      # the ancestry check below.
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          # Releases are cut from main (CONTRIBUTING.md workflow). Refuse to
          # publish a release whose tag points at a commit that never landed
          # on main, e.g. a tag pushed from a stray branch.
          release_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release commit $release_commit is not an ancestor of origin/main; refusing to publish." >&2
            exit 1
          fi
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
        id: release_commit

      # The UI footer shows the running version (issue #44). Strip the "v"
      # prefix from the validated semver tag (v0.1.0 -> 0.1.0) and pass it
      # into the image as the PPM_VERSION build argument below. The tag is
      # only used via env:, never interpolated into the script.
      - name: Derive application version from release tag
        id: app_version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # github.repository is already all-lowercase for this repo; GHCR
          # requires a lowercase image path.
          images: ghcr.io/${{ github.repository }}
          # latest is managed explicitly below instead of implicitly.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          # Override the generated revision/version labels: on release events
          # github.sha can refer to default-branch context, while the image is
          # built from the tag commit checked out above.
          labels: |
            org.opencontainers.image.revision=${{ steps.release_commit.outputs.release_commit }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Build from the checked-out release commit, not a remote ref.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PPM_VERSION=${{ steps.app_version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-stored supply-chain metadata; needs no credentials
          # beyond the packages: write token used for the push itself.
          provenance: mode=max
          sbom: true
