# Build the user-guide PDF and attach it to every published GitHub Release
# (Refs #49), plus a manual backfill path for existing releases.
#
# Security (same discipline as release-image.yml):
#   - Triggered by `release: published` (drafts never fire `published`; an
#     explicit guard enforces this anyway) and by a manual workflow_dispatch
#     that names an existing release tag for backfill.
#   - The release/input tag is validated as strict semver before any checkout
#     or build, is only ever used via `env:` in shell steps, and the tag
#     commit must be an ancestor of main (consistent with release-image.yml).
#   - Least-privilege GITHUB_TOKEN: the build job gets contents: read; only
#     the small upload job gets contents: write. No long-lived secret.
#   - All third-party actions are pinned to immutable commit SHAs, the PDF
#     renderer is a digest-pinned container (see tools/pdf/build_pdf.py), and
#     the validator dependency is hash-pinned
#     (tools/pdf/requirements-validate.txt).
#
# Documentation source selection (exact-tag rule, issue #49):
#   - The guide is taken from `docs/user-guide.md` at the exact release-tag
#     commit whenever that file exists there. The default branch is never
#     consulted for releases that ship a guide.
#   - Releases older than the guide (v0.1.0) have no documentation at their
#     tag. For those, the build falls back to the retrospective snapshot
#     committed under `docs/releases/<tag>/user-guide.md`, which is keyed to
#     that tag, audited against the application source at that tag, and
#     carries an explicit provenance note in its "About this edition"
#     section. If neither source exists, the build fails.
#
# Reproducibility: the generation date is the committer date of the release
# tag commit (not the wall clock), and the same timestamp seeds
# SOURCE_DATE_EPOCH inside the pinned renderer, so rebuilding the same tag
# produces the same PDF.
#
# Safe rerun: the upload uses `gh release upload --clobber`, which atomically
# replaces an identically named asset instead of creating a duplicate, and a
# post-upload check asserts exactly one asset with the expected name. A build
# or validation failure fails the run before the upload job starts, so no
# stale file is ever uploaded.

name: Release user guide

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to rebuild/backfill (strict semver, e.g.
          v0.1.0). The release must already exist; this never creates one.
        required: true
        type: string

# One PDF run per release tag; a rerun or re-published release waits for a
# still-running build of the same tag instead of racing it.
concurrency:
  group: release-user-guide-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Belt and braces: `published` already excludes drafts, but never build
    # from a draft even if trigger semantics change.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.draft }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      asset: ${{ steps.pdf.outputs.asset }}
    steps:
      - name: Validate the release tag is strict semver
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Accept vMAJOR.MINOR.PATCH with an optional semver prerelease
          # suffix (e.g. v0.1.0, v1.2.3-rc.1). Anything else aborts before
          # any checkout, build or upload happens.
          if ! printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::Tag '$TAG' is not a semver tag (vMAJOR.MINOR.PATCH[-prerelease]); refusing to build." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The PDF toolchain (tools/pdf/, snapshot guides) comes from the
      # workflow's own ref: the release tag on release events, the chosen
      # branch on manual dispatch. Release documentation never comes from
      # here unless the tag itself predates the guide (see below).
      - name: Check out the workflow ref (toolchain)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the release exists (manual backfill only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Backfill attaches to an existing release; it must never create
          # or modify a release/tag. gh exits non-zero when none exists.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft --jq '.' > release.json
          if [ "$(jq -r .isDraft release.json)" != "false" ]; then
            echo "::error::Release '$TAG' is a draft; refusing to backfill." >&2
            exit 1
          fi
          rm release.json

      # Check out the exact release-tag commit separately. fetch-depth: 0
      # brings in main for the ancestry check below.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          path: release-src

      - name: Verify the tag commit is on main
        working-directory: release-src
        run: |
          # Releases are cut from main (CONTRIBUTING.md workflow). Refuse to
          # document a release whose tag points at a commit that never landed
          # on main, consistent with release-image.yml.
          release_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release commit $release_commit is not an ancestor of origin/main; refusing to build." >&2
            exit 1
          fi

      - name: Select the guide source for this tag
        id: source
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Exact-tag documentation first; the committed retrospective
          # snapshot only for pre-guide releases (see the header comment).
          if [ -f "release-src/docs/user-guide.md" ]; then
            echo "source=release-src/docs/user-guide.md" >> "$GITHUB_OUTPUT"
            echo "Guide source: docs/user-guide.md at tag $TAG"
          elif [ -f "docs/releases/$TAG/user-guide.md" ]; then
            echo "source=docs/releases/$TAG/user-guide.md" >> "$GITHUB_OUTPUT"
            echo "Guide source: retrospective snapshot docs/releases/$TAG/user-guide.md (tag predates the guide)"
          else
            echo "::error::No guide source exists for tag $TAG (neither at the tag nor as a snapshot); refusing to build." >&2
            exit 1
          fi

      - name: Derive the deterministic generation date from the tag commit
        id: date
        working-directory: release-src
        run: |
          # Committer date of the release-tag commit, in UTC. Deterministic:
          # rebuilding the same tag always injects the same date.
          date="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the PDF with the digest-pinned renderer
        id: pdf
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DATE: ${{ steps.date.outputs.date }}
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          python3 tools/pdf/build_pdf.py \
            --version "$TAG" \
            --date "$DATE" \
            --source "$SOURCE" \
            --output-dir "$RUNNER_TEMP/pdf"
          asset="picture-postcard-manager-user-guide-$TAG.pdf"
          test -s "$RUNNER_TEMP/pdf/$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Validate the PDF
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: ${{ steps.pdf.outputs.asset }}
        run: |
          pip install --require-hashes -r tools/pdf/requirements-validate.txt
          python3 tools/pdf/validate_pdf.py \
            --pdf "$RUNNER_TEMP/pdf/$ASSET" --version "$TAG"

      - name: Hand the PDF to the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-guide-pdf
          path: ${{ runner.temp }}/pdf/${{ steps.pdf.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  # Only this job can write to the repository, and only to attach the
  # already-validated asset to the already-existing release.
  upload:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download the validated PDF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: user-guide-pdf
          path: pdf

      - name: Upload the release asset (replace on rerun, never duplicate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          test -s "pdf/$ASSET"
          # --clobber replaces an existing asset of the same name, so a
          # rerun or re-published release cannot create duplicates.
          gh release upload "$TAG" "pdf/$ASSET" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify exactly one guide asset is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq "[.assets[].name | select(. == \"$ASSET\")] | length")"
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly one asset named $ASSET on $TAG, found $count." >&2
            exit 1
          fi
          echo "Attached $ASSET to $TAG."
