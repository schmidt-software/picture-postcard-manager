<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="appTitle">Picture Postcard Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1 data-i18n="appTitle">Picture Postcard Manager</h1>
    <nav>
      <button data-view="browse" class="active" data-i18n="browse">Browse</button>
      <button data-view="edit" id="nav-new" data-i18n="newPostcard">New postcard</button>
      <button data-view="data" data-i18n="importExport">Import / Export</button>
    </nav>
    <div class="language-picker">
      <label for="language-select" data-i18n="language">Language</label>
      <select id="language-select"></select>
    </div>
  </header>

  <main>
    <section id="view-browse" class="view">
      <input type="search" id="search" placeholder="Search…" data-i18n-placeholder="search"
             aria-label="Search…" data-i18n-aria-label="search">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-i18n="id">ID</th>
            <th data-i18n="frontImage">Front image</th>
            <th data-i18n="backImage">Back image</th>
            <th data-i18n="place">Place</th>
            <th data-i18n="year">Year</th>
            <th data-i18n="tags">Tags</th>
            <th data-i18n="updated">Updated</th>
          </tr></thead>
          <tbody id="postcard-list"></tbody>
        </table>
      </div>
      <p id="empty-hint" hidden data-i18n="emptyPostcards">No postcards yet.</p>
    </section>

    <section id="view-detail" class="view" hidden aria-labelledby="detail-title">
      <div class="detail-heading">
        <h2 id="detail-title" tabindex="-1"></h2>
        <div class="actions">
          <button type="button" id="detail-back" data-i18n="backToOverview">Back to overview</button>
          <button type="button" id="detail-edit" data-i18n="edit">Edit</button>
        </div>
      </div>
      <p id="detail-status" role="status" aria-live="polite"></p>
      <article id="detail-content" hidden>
        <div id="detail-photos" class="detail-photos"></div>
        <dl id="detail-metadata" class="detail-metadata"></dl>
        <section class="detail-sharing" aria-labelledby="share-heading">
          <h3 id="share-heading" data-i18n="sharePostcard">Share postcard</h3>
          <label for="share-url" data-i18n="shareLink">Link to this postcard</label>
          <div class="share-controls">
            <input id="share-url" type="text" readonly>
            <button type="button" id="copy-share-link" data-i18n="copyLink">Copy link</button>
          </div>
          <p id="share-status" role="status" aria-live="polite"></p>
          <p data-i18n="shareAccessHint">Recipients must be able to reach this application and have any required access.</p>
        </section>
      </article>
    </section>

    <section id="view-edit" class="view" hidden>
      <h2 id="form-title" data-i18n="newPostcard">New postcard</h2>
      <form id="postcard-form" novalidate>
        <input type="hidden" name="id">
        <label><span data-i18n="frontImagePath">Front image path</span>
          <input name="front_image_path" required aria-describedby="front-image-error">
        </label>
        <p id="front-image-error" class="validation-error" role="alert" hidden></p>
        <div class="file-picker">
          <input type="file" id="front-image-file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
          <button type="button" id="choose-front-image" data-i18n="chooseFrontImage" aria-describedby="front-image-status">Choose front image</button>
          <span id="front-image-status" aria-live="polite"></span>
        </div>
        <label><span data-i18n="backImagePath">Back image path</span><input name="back_image_path"></label>
        <div class="file-picker">
          <input type="file" id="back-image-file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
          <button type="button" id="choose-back-image" data-i18n="chooseBackImage" aria-describedby="back-image-status">Choose back image</button>
          <span id="back-image-status" aria-live="polite"></span>
        </div>
        <label><span data-i18n="place">Place</span><input name="place"></label>
        <label><span data-i18n="region">Region</span><input name="region"></label>
        <label><span data-i18n="year">Year</span><input name="year"></label>
        <label><span data-i18n="description">Description</span><textarea name="description" rows="5"></textarea></label>
        <fieldset class="tags-field">
          <legend data-i18n="tags">Tags</legend>
          <ul id="tag-list" class="tag-list" data-i18n-aria-label="tags" aria-label="Tags"></ul>
          <div class="tag-add">
            <input id="tag-input" data-i18n-aria-label="newTag" aria-label="New tag"
                   data-i18n-placeholder="newTag" placeholder="New tag" autocomplete="off">
            <button type="button" id="add-tag" data-i18n="addTag">Add tag</button>
          </div>
        </fieldset>
        <div class="actions">
          <button type="submit" id="save" data-i18n="save">Save</button>
          <button type="button" id="cancel" data-i18n="cancel">Cancel</button>
          <button type="button" id="delete" class="danger" hidden data-i18n="delete">Delete</button>
        </div>
      </form>
    </section>

    <section id="view-data" class="view" hidden>
      <h2 data-i18n="export">Export</h2>
      <p><a href="/api/export" download data-i18n="downloadJson">Download database as JSON</a></p>
      <h2 data-i18n="import">Import</h2>
      <form id="import-form" novalidate>
        <input type="file" name="file" id="import-file" accept="application/json,.json" hidden>
        <div class="file-picker">
          <button type="button" id="choose-file" data-i18n="chooseFile" aria-describedby="file-name file-error">Choose JSON file</button>
          <span id="file-name" aria-live="polite"></span>
        </div>
        <p id="file-error" class="validation-error" role="alert" hidden></p>
        <label><input type="radio" name="mode" value="append" checked><span data-i18n="appendPostcards">Append to existing postcards</span></label>
        <label><input type="radio" name="mode" value="replace"><span data-i18n="replacePostcards">Replace all existing postcards</span></label>
        <button type="submit" data-i18n="import">Import</button>
      </form>
    </section>
  </main>

  <dialog id="confirmation" aria-labelledby="confirmation-text">
    <form method="dialog">
      <p id="confirmation-text"></p>
      <div class="actions">
        <button value="cancel" data-i18n="cancel" autofocus>Cancel</button>
        <button value="confirm" id="confirm-action"></button>
      </div>
    </form>
  </dialog>
  <div id="message" role="status" aria-live="polite" hidden></div>
  <script src="/languages.js"></script>
  <script src="/app.js"></script>
</body>
</html>
