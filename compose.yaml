name: picture-postcard-manager

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PPM_PORT:-8000}:8000"
    volumes:
      - postcard-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/postcards', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postcard-data:
